<!DOCTYPE html>
<html lang="en">
<head>

<title>Bonvinco Tactical Response - Contact</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
.gold{color:#d4af37;}
h1,h2{margin-bottom:10px;}
.card{
  background:#222;
  border:1px solid #444;
  border-radius:8px;
  padding:15px;
  margin-bottom:20px;
}

/* REACH US */
.reach-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #333;
}
.reach-left{
  display:flex;
  align-items:center;
  gap:10px;
}
.reach-left i{
  color:#d4af37;
}
.copy-btn{
  cursor:pointer;
  color:#aaa;
  transition:0.3s;
}
.copy-btn:hover{
  color:#d4af37;
}

/* FORM */
label{
  font-size:12px;
  color:#d4af37;
}
input,textarea{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
textarea{resize:none;}
.form-section{
  position:relative;
}
.form-section i{
  color:#d4af37;
  cursor:pointer;
  margin-left:5px;
}
/* Toggle Button */
.drawer-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10000;
  background: rgba(0,0,0,0.7);
  border: none;
  color: gold;
  font-size: 1.5rem;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}
.drawer-toggle:hover {
  background: rgba(0,0,0,0.9);
}

/* Right Drawer */
.drawer {
  position: fixed;
  top: 0;
  right: -80px; /* Start hidden */
  height: 100%;
  width: 80px;
  background: rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;
  gap: 30px;
  z-index: 9999;
  transition: right 0.3s;
}

/* Drawer Items */
.drawer-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: gold;
  font-weight: bold;
  transition: transform 0.3s, color 0.3s;
}
.drawer-item i {
  font-size: 2rem;
  margin-bottom: 5px;
}
.drawer-item:hover {
  color: #FFD700;
  transform: translateX(-5px);
}

/* Drawer Active */
.drawer.open {
  right: 0;
}
/* AI HINT */
.ai-hint{
  position:absolute;
  background:#111;
  border:1px solid #d4af37;
  padding:8px;
  font-size:12px;
  border-radius:6px;
  margin-top:5px;
  z-index:20;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:6px;
  background:#d4af37;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

/* SOCIAL */
.social-links{
  display:flex;
  justify-content:space-around;
  margin-top:20px;
}
.social-links a{
  color:#fff;
  font-size:22px;
}
.social-links a:hover{color:#d4af37;}
</style>
</head>

<body>
    

<h1 class="gold">AI-Powered </h1>

<h1 class ="gold" >Consult Form</h1>
<!-- Toggle Button -->
<button id="drawerToggle" class="drawer-toggle">
  <i class="fas fa-bars"></i>
</button>

<!-- Right Side Drawer -->
<div class="drawer" id="drawer">

  <a href="index.html" class="drawer-item">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </a>

  <a href="service.html" class="drawer-item">
    <i class="fas fa-concierge-bell"></i>
    <span>Services</span>
  </a>

  <a href="about.html" class="drawer-item">
    <i class="fas fa-info-circle"></i>
    <span>About Us</span>
  </a>

  <a href="jobs.html" class="drawer-item">
    <i class="fas fa-briefcase"></i>
    <span>Jobs</span>
  </a>

  <a href="ads.html" class="drawer-item">
    <i class="fas fa-bullhorn"></i>

  </a>

  <a href="contact.html" class="drawer-item">
    <i class="fas fa-envelope"></i>
    <span>Contact</span>
  </a>

</div>
<div class="card">
  Click the 🔎 icons for AI guidance while completing the form.
</div>

<!-- FORM -->
<div class="form-section">
  <label>Name & Surname</label>
  <input id="fullName" placeholder="Your full name">
  <i class="fas fa-circle-question" onclick="showHint(this,'Enter your full name')"></i>

<div class="form-section">
  <label>Email</label>
  <input id="email" type="email" placeholder="Your email">
  <i class="fas fa-circle-question" onclick="showHint(this,'Use an active email address')"></i>
</div>

<div class="form-section">
  <label>Cellphone / WhatsApp</label>
  <input id="cell" placeholder="Your contact number">
  <i class="fas fa-circle-question" onclick="showHint(this,'WhatsApp-reachable number')"></i>
</div>

<div class="form-section">
  <label>Message</label>
  <textarea id="message" rows="4" placeholder="Write your message"></textarea>
  <i class="fas fa-circle-question" onclick="showHint(this,'Be clear and direct')"></i>
</div>

<button onclick="sendConsult()">Submit</button>

<div id="notification" class="card" style="display:none;color:#d4af37;"></div>

<!-- REACH US -->
<h2 class="gold">Would you like to reach us?</h2>

<div class="card">
  <div class="reach-item">
    <div class="reach-left">
      <i class="fas fa-envelope"></i> vacancies@boninco.com
    </div>
    <i class="fas fa-copy copy-btn" onclick="copyText('bonvincotrading@gmail.com')"></i>

  </div>

  <div class="reach-item">

      <i class="fas fa-phone"></i> Ermelo – 087 149 4670
    </div>
    <i class="fas fa-copy copy-btn" onclick="copyText('0871494670')"></i>
  </div>

  <div class="reach-item">
    <div class="reach-left">
      <i class="fas fa-phone"></i> Witbank – 0836217499
    </div>

  </div>

  <div class="reach-item">
    <div class="reach-left">
      <i class="fas fa-location-dot"></i> OFFICE 1, 14 Kerk Street, Ermelo,2351
    </div>
  </div>
</div>

<!-- SOCIAL -->
<div class="social-links">
  <a href="https://www.facebook.com/profile.php?id=61586572542499"><i class="fab fa-facebook"></i></a>
  <a href="https://www.instagram.com/bonvincotartical/"><i class="fab fa-instagram"></i></a>
  <a href="https://www.tiktok.com/@bonvincotartical"><i class="fab fa-tiktok"></i></a>
  <a href="https://wa.me/27725938007" target="_blank"><i class="fab fa-whatsapp"></i></a>
</div>
<!-- BONVI CHATBOT -->
<style>
#bonvi-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#FFD700;
  color:black;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 15px #FFD700;
}

/* CHAT BOX */
#bonvi-chat{
  position:fixed;
  bottom:90px;
  right:20px;
  width:320px;
  background:#0A0A0F;
  border-radius:15px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 20px #FFD700;
}

/* HEADER */
.chat-header{
  background:#FFD700;
  color:black;
  padding:10px;
  font-weight:bold;
}

/* MESSAGES */
.chat-body{
  padding:10px;
  height:300px;
  overflow-y:auto;
}

/* BUBBLES */
.bot{
  background:white;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

.user{
  background:#FFD700;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
  text-align:right;
}

/* SUGGESTIONS */
.suggestions{
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.suggestions button{
  background:#FFD700;
  border:none;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;
}
</style>

<button id="bonvi-btn">💬</button>

<div id="bonvi-chat">
  <div class="chat-header">✨ Bonvi Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="suggestions" id="suggestions">
    <button onclick="send('location')">Location</button>
    <button onclick="send('services')">Services</button>
    <button onclick="send('contact')">Contact</button>
    <button onclick="send('faq')">FAQ</button>
  </div>
</div>

<script>
const chat = document.getElementById("bonvi-chat");
const body = document.getElementById("chatBody");
const suggestions = document.getElementById("suggestions");

document.getElementById("bonvi-btn").onclick = ()=>{
  chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  chat.style.flexDirection = "column";
};

// GREETING
function greet(){
  addBot(`Hi 👋 I'm Bonvi, your friendly assistant!<br><br>
  I can help you with our location, services, or connecting you with our admin team.<br><br>
  What would you like to know today?`);
}
greet();

// SEND FUNCTION
function send(type){
  addUser(type);

if(type === "location"){
  addBot(`Sure! Here's our location 📍:<br>
  9 Corridor Crest, Ben Fleur, eMalahleni 1049<br><br>
  <img src="map.jpg" alt="Map Location" style="width:100%;border-radius:10px;">`);
  showSuggestions(["services","contact","faq"]);
}

 
else if(type === "services"){
  addBot(`Absolutely! Here are our services 🛡:<br><br>
  
<b>Armed Response</b><br>
Authorized armed response with trained personnel to protect your property and personnel quickly and efficiently.<br><br>

<b>Railway Protection</b><br>
Protection of railway assets and infrastructure to ensure safety, security, and operational continuity.<br><br>

<b>Mobile Patrol</b><br>
Regular vehicle patrols for rapid area monitoring and deterrence of unauthorized activity.<br><br>

<b>Event Security</b><br>
Professional crowd and event control to ensure safety and smooth operations during public and private events.<br><br>

<b>VIP Escort</b><br>
Close protection services for high-profile individuals to guarantee personal safety.<br><br>

<b>Dog Handling (K9)</b><br>
Highly trained K9 units for security patrols, detection, and threat deterrence.<br><br>

<b>Drone Surveillance</b><br>
Aerial security surveillance services for enhanced monitoring of large areas or difficult-to-reach locations.<br><br>

<b>CCTV Installation</b><br>
Professional setup and monitoring of CCTV systems to ensure constant surveillance and safety.`);
  
  showSuggestions(["pricing","book","contact","faq"]);
}
  else if(type === "contact"){
    addBot(`Of course! You can contact us 📞:<br><br>
    📧 vacancies@boninco.com<br>
    📧 admin@bonvinco.com<br><br>
    Ermelo – 087 149 4670<br>
    Witbank – 083 621 7499<br><br>
    🏢 OFFICE 1, 14 Kerk Street, Ermelo, 2351`);
    showSuggestions(["location","services","faq"]);
  }

  else if(type === "faq"){
    addBot(`Here are some frequently asked questions 🤔:<br><br>
    1️⃣ What are your operating hours?<br>
    2️⃣ How do I book a service?<br>
    3️⃣ Do you provide emergency support?<br><br>
    Click a question to see the answer.`);
    showSuggestions(["hours","book","emergency","contact"]);
  }

  else if(type === "hours"){
    addBot(`🕘 We operate 24/7 to ensure your safety!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "book"){
    addBot(`To book a service, just contact our admin via 📧 admin@bonvinco.com or 📞 087 149 4670. They'll assist you immediately!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "emergency"){
    addBot(`Yes! We provide emergency response 24/7. 🚨<br>
    Call our emergency line immediately if needed.`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "pricing"){
    addBot(`Pricing depends on the service. For exact quotes, please contact us via 📧 admin@bonvinco.com.`);
    showSuggestions(["services","contact","faq"]);
  }
}

// SHOW DYNAMIC SUGGESTIONS
function showSuggestions(options){
  suggestions.innerHTML = "";
  const map = {
    location:"Location",
    services:"Services",
    contact:"Contact",
    faq:"FAQ",
    hours:"Operating Hours",
    book:"Book a Service",
    emergency:"Emergency Support",
    pricing:"Pricing"
  };

  options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.innerHTML = map[opt];
    btn.onclick = ()=>send(opt);
    suggestions.appendChild(btn);
  });
}

// MESSAGE FUNCTIONS
function addBot(text){
  body.innerHTML += `<div class="bot">${text}</div>`;
  body.scrollTop = body.scrollHeight;
}

function addUser(text){
  body.innerHTML += `<div class="user">${text}</div>`;
}
</script>
<script>
    const drawer = document.getElementById('drawer');
const toggleBtn = document.getElementById('drawerToggle');

toggleBtn.addEventListener('click', () => {
  drawer.classList.toggle('open');
});
function showHint(el,text){
  document.querySelectorAll('.ai-hint').forEach(h=>h.remove());
  const hint=document.createElement('div');
  hint.className='ai-hint';
  hint.innerText=text;
  el.parentElement.appendChild(hint);
  setTimeout(()=>hint.remove(),4000);
}

function copyText(text){
  navigator.clipboard.writeText(text);
  alert('Copied: ' + text);
}

function sendConsult(){
  const n=fullName.value,e=email.value,c=cell.value,m=message.value;
  if(!n||!e||!c||!m){alert('Fill all fields');return;}

  const msg=`Bonvinco Tactical Response\nName:${n}\nEmail:${e}\nCell:${c}\nMessage:${m}`;
  document.getElementById('notification').style.display='block';
  document.getElementById('notification').innerText='Opening WhatsApp…';

  window.open(`https://wa.me/27871494670?text=${encodeURIComponent(msg)}`,'_blank');
}
</script>

</body>
