<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Bonvinco Tactical Response</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root {
    --gold: #FFD700;
    --dark: #0A0A0F;
    --card: #16161E;
    --border: #2D2D35;
  }

  body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--dark);
    color: #fff;
    padding: 20px;
  }

  .container { max-width: 800px; margin: 40px auto; }

  h1.gold {
    font-size: 2.2rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
    color: var(--gold);
  }

  .subtitle { color: #888; margin-bottom: 30px; font-size: 0.9rem; }

  /* --- Navigation Drawer --- */
  .drawer-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 10001;
    background: var(--gold); border: none; width: 45px; height: 45px;
    border-radius: 50%; cursor: pointer; color: #000;
  }

  .drawer {
    position: fixed; top: 0; right: -280px; width: 280px; height: 100%;
    background: rgba(10, 10, 15, 0.98); backdrop-filter: blur(10px);
    z-index: 10000; transition: 0.4s; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; padding-top: 80px;
  }

  .drawer.open { right: 0; }
  .drawer-item {
    padding: 15px 30px; color: var(--gold); text-decoration: none;
    display: flex; align-items: center; gap: 15px; font-weight: bold;
  }

  /* --- Contact Cards --- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .reach-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid #222;
  }

  .reach-item:last-child { border: none; }
  .reach-left { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; }
  .reach-left i { color: var(--gold); width: 20px; }

  .copy-btn { cursor: pointer; color: #555; transition: 0.3s; }
  .copy-btn:hover { color: var(--gold); }

  /* --- Consultation Form --- */
  .form-group { position: relative; margin-bottom: 15px; }
  label { display: block; font-size: 0.75rem; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
  
  input, textarea {
    width: 100%; padding: 12px; background: #000; border: 1px solid var(--border);
    border-radius: 8px; color: #fff; box-sizing: border-box; font-family: inherit;
  }

  input:focus, textarea:focus { border-color: var(--gold); outline: none; }

  .ai-trigger {
    position: absolute; right: 10px; top: 32px;
    color: #444; cursor: pointer; transition: 0.3s;
  }
  .ai-trigger:hover { color: var(--gold); }

  .ai-hint {
    background: var(--gold); color: #000; padding: 8px 12px;
    border-radius: 6px; font-size: 0.8rem; font-weight: bold;
    position: absolute; right: 40px; top: 25px; z-index: 10;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .submit-btn {
    width: 100%; padding: 15px; background: var(--gold); border: none;
    border-radius: 8px; font-weight: 800; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
  }

  /* --- Socials --- */
  .social-bar {
    display: flex; justify-content: center; gap: 25px; margin-top: 30px;
  }
  .social-bar a { color: #fff; font-size: 1.5rem; transition: 0.3s; }
  .social-bar a:hover { color: var(--gold); transform: translateY(-3px); }

</style>
</head>
<body>

<button id="drawerToggle" class="drawer-toggle"><i class="fas fa-bars"></i></button>

<div class="drawer" id="drawer">
  <a href="index.html" class="drawer-item"><i class="fas fa-home"></i> Home</a>
  <a href="service.html" class="drawer-item"><i class="fas fa-shield-alt"></i> Services</a>
  <a href="about.html" class="drawer-item"><i class="fas fa-info-circle"></i> About</a>
  <a href="jobs.html" class="drawer-item"><i class="fas fa-briefcase"></i> Jobs</a>
  <a href="ads.html" class="drawer-item"><i class="fas fa-bullhorn"></i> Ads</a>
  <a href="contact.html" class="drawer-item"><i class="fas fa-envelope"></i> Contact</a>
</div>

<div class="container">
  <h1 class="gold">AI-Powered</h1>
  <h1 class="gold">Consultation Portal</h1>
  <p class="subtitle">Secure communication channel for tactical inquiries.</p>

  <div class="card">
    <div class="form-group">
      <label>Full Identity</label>
      <input id="fullName" placeholder="Mthokozisi Mathebula">
      <i class="fas fa-robot ai-trigger" onclick="showHint(this, 'Provide your legal name for verification.')"></i>
    </div>

    <div class="form-group">
      <label>Electronic Mail</label>
      <input id="email" type="email" placeholder="client@example.com">
      <i class="fas fa-robot ai-trigger" onclick="showHint(this, 'Enter an email you check frequently.')"></i>
    </div>

    <div class="form-group">
      <label>Tactical Comms (WhatsApp)</label>
      <input id="cell" placeholder="+27 ...">
      <i class="fas fa-robot ai-trigger" onclick="showHint(this, 'Required for rapid mobile coordination.')"></i>
    </div>

    <div class="form-group">
      <label>Inquiry Details</label>
      <textarea id="message" rows="4" placeholder="Describe your security requirements..."></textarea>
      <i class="fas fa-robot ai-trigger" onclick="showHint(this, 'Mention specific services like Armed Response or K9.')"></i>
    </div>

    <button class="submit-btn" onclick="sendConsult()">Initialize Secure Chat</button>
  </div>

  <h2 class="gold" style="font-size: 1.2rem;">Direct Command Center</h2>
  <div class="card">
    <div class="reach-item">
      <div class="reach-left"><i class="fas fa-envelope"></i> admin@bonvinco.com</div>
      <i class="fas fa-copy copy-btn" onclick="copyText('admin@bonvinco.com')"></i>
    </div>
    <div class="reach-item">
      <div class="reach-left"><i class="fas fa-phone"></i> Ermelo: 087 149 4670</div>
      <i class="fas fa-copy copy-btn" onclick="copyText('0871494670')"></i>
    </div>
    <div class="reach-item">
      <div class="reach-left"><i class="fas fa-phone"></i> Witbank: 083 621 7499</div>
      <i class="fas fa-copy copy-btn" onclick="copyText('0836217499')"></i>
    </div>
    <div class="reach-item" style="border: none;">
      <div class="reach-left"><i class="fas fa-map-marker-alt"></i> 14 Kerk Street, Ermelo, 2351</div>
    </div>
  </div>

  <div class="social-bar">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-tiktok"></i></a>
    <a href="https://wa.me/27725938007"><i class="fab fa-whatsapp"></i></a>
  </div>
</div>

<script>
  // Drawer Toggle
  const drawer = document.getElementById('drawer');
  document.getElementById('drawerToggle').onclick = () => drawer.classList.toggle('open');

  // AI Hints
  function showHint(el, text) {
    const existing = el.parentElement.querySelector('.ai-hint');
    if(existing) existing.remove();

    const hint = document.createElement('div');
    hint.className = 'ai-hint';
    hint.innerText = text;
    el.parentElement.appendChild(hint);
    setTimeout(() => hint.remove(), 3000);
  }

  // Copy Logic
  function copyText(text) {
    navigator.clipboard.writeText(text);
    alert('Information Copied to Clipboard');
  }

  // Submit to WhatsApp
  function sendConsult() {
    const n = document.getElementById('fullName').value;
    const e = document.getElementById('email').value;
    const c = document.getElementById('cell').value;
    const m = document.getElementById('message').value;

    if(!n || !e || !c || !m) { alert('All tactical data fields must be filled.'); return; }

    const secureMsg = `*BONVINCO TACTICAL INQUIRY*\n---\n*Name:* ${n}\n*Email:* ${e}\n*Contact:* ${c}\n*Request:* ${m}`;
    window.open(`https://wa.me/27871494670?text=${encodeURIComponent(secureMsg)}`, '_blank');
  }
</script>

</body>
</html>
