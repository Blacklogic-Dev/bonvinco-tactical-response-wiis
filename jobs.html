<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonvinco Tactical Response | AI Application Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root {
    --gold: #FFD700;
    --dark-bg: #0A0A0F;
    --card-bg: #16161D;
    --border: #2D2D35;
    --text: #E0E0E0;
}

body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--dark-bg);
    color: var(--text);
    padding-bottom: 50px;
}

/* ================= DRAWER NAVIGATION ================= */
.drawer-toggle {
    position: fixed; top: 20px; right: 20px;
    z-index: 1000; background: var(--gold);
    border: none; color: #000; font-size: 1.2rem; 
    width: 45px; height: 45px; border-radius: 50%;
    cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.drawer {
    position: fixed; top: 0; right: -280px;
    height: 100%; width: 280px;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(15px);
    display: flex; flex-direction: column;
    padding-top: 80px; z-index: 999;
    transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border-left: 1px solid rgba(255,215,0,0.2);
}

.drawer.open { right: 0; }

.drawer-item {
    display: flex; align-items: center;
    padding: 15px 30px; text-decoration: none;
    color: var(--gold); font-weight: 600;
    gap: 15px; transition: 0.3s;
}

.drawer-item:hover { background: rgba(255,215,0,0.1); padding-left: 40px; }

/* ================= FORM STYLING ================= */
.main-container {
    max-width: 800px;
    margin: 60px auto;
    padding: 20px;
}

.form-header {
    text-align: center;
    margin-bottom: 40px;
}

.form-header h1 { color: var(--gold); font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }

.application-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.full-width { grid-column: 1 / -1; }

.relative { position: relative; }

label {
    display: block;
    font-size: 0.85rem;
    color: var(--gold);
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: #fff;
    box-sizing: border-box;
    transition: 0.3s;
}

input:focus, select:focus { border-color: var(--gold); outline: none; }

.ai-trigger {
    position: absolute;
    right: 12px;
    top: 38px;
    color: var(--gold);
    cursor: pointer;
    opacity: 0.7;
}

.ai-trigger:hover { opacity: 1; }

.ai-hint-box {
    background: #1e1e26;
    border-left: 4px solid var(--gold);
    padding: 10px;
    font-size: 0.8rem;
    margin-top: 5px;
    border-radius: 4px;
    display: none;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

/* ================= ACTION BUTTONS ================= */
.add-actions {
    display: flex; gap: 10px; margin: 20px 0;
}

.btn-sec {
    flex: 1; background: transparent;
    border: 1px dashed var(--gold);
    color: var(--gold); padding: 12px;
    border-radius: 8px; cursor: pointer;
    font-weight: bold; transition: 0.3s;
}

.btn-sec:hover { background: rgba(255,215,0,0.1); }

.gold-btn {
    width: 100%; padding: 15px;
    background: var(--gold); color: #000;
    border: none; border-radius: 8px;
    font-weight: 800; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
    transition: 0.3s; margin-top: 20px;
}

.gold-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,215,0,0.3); }

/* ================= CHATBOT ================= */
#bonvi-btn {
    position: fixed; bottom: 25px; left: 25px;
    background: var(--gold); border: none;
    width: 60px; height: 60px; border-radius: 50%;
    font-size: 1.5rem; cursor: pointer; z-index: 1000;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}

#bonvi-chat {
    position: fixed; bottom: 100px; left: 25px;
    width: 320px; height: 450px;
    background: var(--card-bg); border: 1px solid var(--gold);
    border-radius: 15px; display: none; flex-direction: column;
    z-index: 1000; overflow: hidden;
}

.chat-header { background: var(--gold); color: #000; padding: 15px; font-weight: bold; }
.chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.bot-msg { background: #252530; padding: 10px; border-radius: 12px 12px 12px 0; align-self: flex-start; max-width: 80%; font-size: 0.9rem; }
.user-msg { background: var(--gold); color: #000; padding: 10px; border-radius: 12px 12px 0 12px; align-self: flex-end; font-weight: 600; font-size: 0.9rem; }

/* ================= RECEIPT ================= */
#receiptSection {
    margin-top: 30px; padding: 20px;
    background: #000; border: 1px solid var(--gold);
    display: none; border-radius: 8px;
}
pre { white-space: pre-wrap; font-family: 'Courier New', monospace; font-size: 0.85rem; color: #0f0; }

@media (max-width: 600px) {
    .grid-container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<button id="drawerToggle" class="drawer-toggle"><i class="fas fa-bars"></i></button>

<div class="drawer" id="drawer">
    <a href="index.html" class="drawer-item"><i class="fas fa-home"></i> Home</a>
    <a href="service.html" class="drawer-item"><i class="fas fa-shield-alt"></i> Services</a>
    <a href="about.html" class="drawer-item"><i class="fas fa-info-circle"></i> About Us</a>
    <a href="jobs.html" class="drawer-item"><i class="fas fa-briefcase"></i> Jobs</a>
    <a href="contact.html" class="drawer-item"><i class="fas fa-envelope"></i> Contact</a>
</div>

<div class="main-container">
    <div class="form-header">
        <h1>Tactical Career Portal</h1>
        <p>Deployment Year: 2026 | System Status: Online 🔎</p>
    </div>

    <div class="application-card">
        <!-- Job Profile -->
        <div class="grid-container">
            <div class="relative">
                <label>Target Role</label>
                <select id="jobTitleSelect" onchange="updateJobCode()">
                    <option value="" data-code="">Select Position</option>
                    <option value="Tactical Guard" data-code="BTR-2026/01">Tactical Guard</option>
                    <option value="Drone Pilot" data-code="BTR-2026/04">Drone Pilot</option>
                    <option value="Tactical Driver" data-code="BTR-2026/02">Tactical Driver</option>
                </select>
                <i class="fas fa-search ai-trigger" onclick="toggleHint('jobHint')"></i>
                <div id="jobHint" class="ai-hint-box">Role determines your operational deployment code.</div>
            </div>
            <div class="relative">
                <label>Operational Code</label>
                <input type="text" id="jobCode" readonly placeholder="Auto-generated">
            </div>
        </div>

        <!-- Personal Info -->
        <div class="grid-container">
            <div class="relative">
                <label>Full Names</label>
                <input type="text" id="names" placeholder="As per ID">
            </div>
            <div class="relative">
                <label>Surname</label>
                <input type="text" id="surname">
            </div>
            <div class="relative">
                <label>Age (Min 21)</label>
                <input type="number" id="age">
            </div>
            <div class="relative">
                <label>Email Address</label>
                <input type="email" id="email">
            </div>
        </div>

        <div class="add-actions">
            <button class="btn-sec" onclick="toggleSection('eduSection')">+ Education</button>
            <button class="btn-sec" onclick="toggleSection('expSection')">+ Experience</button>
        </div>

        <!-- Dynamic Inputs -->
        <div id="eduSection" style="display:none; margin-bottom: 20px;">
            <label>Highest Qualification</label>
            <input type="text" id="eduInput" placeholder="e.g. Grade 12 - High School Name (2019)">
        </div>

        <div id="expSection" style="display:none; margin-bottom: 20px;">
            <label>Work History</label>
            <textarea id="expInput" rows="3" placeholder="Company, Role, and Contactable Reference..."></textarea>
        </div>

        <div style="margin-top: 30px;">
            <label style="display:flex; align-items: center; gap: 10px; text-transform: none; color: #fff;">
                <input type="checkbox" id="consent" style="width:auto;"> 
                I confirm that all tactical data provided is accurate.
            </label>
            <button class="gold-btn" onclick="submitApplication()">Deploy Application</button>
        </div>
    </div>

    <!-- Receipt -->
    <div id="receiptSection">
        <h3 style="color:var(--gold)">GENERATED PROFILE DATA</h3>
        <pre id="receiptContent"></pre>
        <button class="gold-btn" onclick="downloadReceipt()">Finalize & Download</button>
    </div>
</div>

<!-- BONVI CHATBOT -->
<style>
#bonvi-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#FFD700;
  color:black;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 15px #FFD700;
}

/* CHAT BOX */
#bonvi-chat{
  position:fixed;
  bottom:90px;
  right:20px;
  width:320px;
  background:#0A0A0F;
  border-radius:15px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 20px #FFD700;
}

/* HEADER */
.chat-header{
  background:#FFD700;
  color:black;
  padding:10px;
  font-weight:bold;
}

/* MESSAGES */
.chat-body{
  padding:10px;
  height:300px;
  overflow-y:auto;
}

/* BUBBLES */
.bot{
  background:white;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

.user{
  background:#FFD700;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
  text-align:right;
}

/* SUGGESTIONS */
.suggestions{
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.suggestions button{
  background:#FFD700;
  border:none;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;
}
</style>

<button id="bonvi-btn">💬</button>

<div id="bonvi-chat">
  <div class="chat-header">✨ Bonvi Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="suggestions" id="suggestions">
    <button onclick="send('location')">Location</button>
    <button onclick="send('services')">Services</button>
    <button onclick="send('contact')">Contact</button>
    <button onclick="send('faq')">FAQ</button>
  </div>
</div>

<script>
const chat = document.getElementById("bonvi-chat");
const body = document.getElementById("chatBody");
const suggestions = document.getElementById("suggestions");

document.getElementById("bonvi-btn").onclick = ()=>{
  chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  chat.style.flexDirection = "column";
};

// GREETING
function greet(){
  addBot(`Hi 👋 I'm Bonvi, your friendly assistant!<br><br>
  I can help you with our location, services, or connecting you with our admin team.<br><br>
  What would you like to know today?`);
}
greet();

// SEND FUNCTION
function send(type){
  addUser(type);

if(type === "location"){
  addBot(`Sure! Here's our location 📍:<br>
  9 Corridor Crest, Ben Fleur, eMalahleni 1049<br><br>
  <img src="map.jpg" alt="Map Location" style="width:100%;border-radius:10px;">`);
  showSuggestions(["services","contact","faq"]);
}

 
else if(type === "services"){
  addBot(`Absolutely! Here are our services 🛡:<br><br>
  
<b>Armed Response</b><br>
Authorized armed response with trained personnel to protect your property and personnel quickly and efficiently.<br><br>

<b>Railway Protection</b><br>
Protection of railway assets and infrastructure to ensure safety, security, and operational continuity.<br><br>

<b>Mobile Patrol</b><br>
Regular vehicle patrols for rapid area monitoring and deterrence of unauthorized activity.<br><br>

<b>Event Security</b><br>
Professional crowd and event control to ensure safety and smooth operations during public and private events.<br><br>

<b>VIP Escort</b><br>
Close protection services for high-profile individuals to guarantee personal safety.<br><br>

<b>Dog Handling (K9)</b><br>
Highly trained K9 units for security patrols, detection, and threat deterrence.<br><br>

<b>Drone Surveillance</b><br>
Aerial security surveillance services for enhanced monitoring of large areas or difficult-to-reach locations.<br><br>

<b>CCTV Installation</b><br>
Professional setup and monitoring of CCTV systems to ensure constant surveillance and safety.`);
  
  showSuggestions(["pricing","book","contact","faq"]);
}
  else if(type === "contact"){
    addBot(`Of course! You can contact us 📞:<br><br>
    📧 vacancies@boninco.com<br>
    📧 admin@bonvinco.com<br><br>
    Ermelo – 087 149 4670<br>
    Witbank – 083 621 7499<br><br>
    🏢 OFFICE 1, 14 Kerk Street, Ermelo, 2351`);
    showSuggestions(["location","services","faq"]);
  }

  else if(type === "faq"){
    addBot(`Here are some frequently asked questions 🤔:<br><br>
    1️⃣ What are your operating hours?<br>
    2️⃣ How do I book a service?<br>
    3️⃣ Do you provide emergency support?<br><br>
    Click a question to see the answer.`);
    showSuggestions(["hours","book","emergency","contact"]);
  }

  else if(type === "hours"){
    addBot(`🕘 We operate 24/7 to ensure your safety!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "book"){
    addBot(`To book a service, just contact our admin via 📧 admin@bonvinco.com or 📞 087 149 4670. They'll assist you immediately!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "emergency"){
    addBot(`Yes! We provide emergency response 24/7. 🚨<br>
    Call our emergency line immediately if needed.`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "pricing"){
    addBot(`Pricing depends on the service. For exact quotes, please contact us via 📧 admin@bonvinco.com.`);
    showSuggestions(["services","contact","faq"]);
  }
}

// SHOW DYNAMIC SUGGESTIONS
function showSuggestions(options){
  suggestions.innerHTML = "";
  const map = {
    location:"Location",
    services:"Services",
    contact:"Contact",
    faq:"FAQ",
    hours:"Operating Hours",
    book:"Book a Service",
    emergency:"Emergency Support",
    pricing:"Pricing"
  };

  options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.innerHTML = map[opt];
    btn.onclick = ()=>send(opt);
    suggestions.appendChild(btn);
  });
}

// MESSAGE FUNCTIONS
function addBot(text){
  body.innerHTML += `<div class="bot">${text}</div>`;
  body.scrollTop = body.scrollHeight;
}

function addUser(text){
  body.innerHTML += `<div class="user">${text}</div>`;
}
</script>

<script>
// Sidebar
const drawer = document.getElementById('drawer');
document.getElementById('drawerToggle').onclick = () => drawer.classList.toggle('open');

// Helpers
function toggleHint(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function toggleSection(id) {
    const el = document.getElementById(id);
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function updateJobCode() {
    const sel = document.getElementById('jobTitleSelect');
    document.getElementById('jobCode').value = sel.options[sel.selectedIndex].dataset.code || '';
}

// Chatbot Logic
const chatBody = document.getElementById('chatBody');
document.getElementById('bonvi-btn').onclick = () => {
    const chat = document.getElementById('bonvi-chat');
    chat.style.display = chat.style.display === 'flex' ? 'none' : 'flex';
};

function botReply(type) {
    const responses = {
        location: "📍 HQ: 9 Corridor Crest, Ben Fleur, eMalahleni. Office 1, 14 Kerk St, Ermelo.",
        services: "🛡 We provide Armed Response, K9 Units, Drone Surveillance, and VIP Protection."
    };
    chatBody.innerHTML += `<div class="user-msg">${type}</div>`;
    setTimeout(() => {
        chatBody.innerHTML += `<div class="bot-msg">${responses[type]}</div>`;
        chatBody.scrollTop = chatBody.scrollHeight;
    }, 500);
}

// Submission
function submitApplication() {
    if(!document.getElementById('consent').checked) return alert("Consent required.");
    
    const data = `
    BONVINCO TACTICAL RESPONSE - CANDIDATE FILE
    -------------------------------------------
    APP ID: BTR-${Math.floor(Math.random()*9000)+1000}
    ROLE: ${document.getElementById('jobTitleSelect').value} [${document.getElementById('jobCode').value}]
    NAME: ${document.getElementById('names').value} ${document.getElementById('surname').value}
    AGE: ${document.getElementById('age').value}
    EMAIL: ${document.getElementById('email').value}
    
    QUALIFICATIONS:
    ${document.getElementById('eduInput').value || 'N/A'}
    
    EXPERIENCE:
    ${document.getElementById('expInput').value || 'N/A'}
    
    STATUS: PENDING REVIEW
    `;
    
    document.getElementById('receiptContent').innerText = data;
    document.getElementById('receiptSection').style.display = 'block';
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function downloadReceipt() {
    const blob = new Blob([document.getElementById('receiptContent').innerText], {type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Bonvinco_Application.txt';
    a.click();
    alert("Profile Secured. Our team will contact you if shortlisted.");
}
</script>

</body>
</html>
