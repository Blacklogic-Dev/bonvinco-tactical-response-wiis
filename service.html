<!DOCTYPE html>
<html lang="en">
<head>

<title>Bonvinco Tactical Response | Services</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
}

/* ================= HEADER SLIDER ================= */
header {
  height: 400px;
  position: relative;
  overflow: hidden;
}

.header-slider {
  display: flex;
  width: 1000%; /* 10 slides × 100% */
  height: 100%;
  animation: slideImages 20s infinite linear;
}

.slide {
  flex: 0 0 10%; /* 100% ÷ 10 slides */
  height: 100%;
  background-size: cover;
  background-position: center;
}

.header-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 2;
}

/* Animate all 10 slides */
@keyframes slideImages {
  0%   { transform: translateX(0%); }
  10%  { transform: translateX(0%); }
  11%  { transform: translateX(-10%); }
  20%  { transform: translateX(-10%); }
  21%  { transform: translateX(-20%); }
  30%  { transform: translateX(-20%); }
  31%  { transform: translateX(-30%); }
  40%  { transform: translateX(-30%); }
  41%  { transform: translateX(-40%); }
  50%  { transform: translateX(-40%); }
  51%  { transform: translateX(-50%); }
  60%  { transform: translateX(-50%); }
  61%  { transform: translateX(-60%); }
  70%  { transform: translateX(-60%); }
  71%  { transform: translateX(-70%); }
  80%  { transform: translateX(-70%); }
  81%  { transform: translateX(-80%); }
  90%  { transform: translateX(-80%); }
  91%  { transform: translateX(-90%); }
  100% { transform: translateX(-90%); }
}

/* ================= SECTION TITLE ================= */
.section-title {
  text-align: center;
  margin: 30px 0 10px;
}

.section-title h1 {
  font-size: 3rem;
  color: gold;
  white-space: nowrap;
  overflow: hidden;
  border-right: 0.15em solid gold;
  width: fit-content;
  margin: auto;
}

/* ================= TOGGLE SWITCH ================= */
.switch-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 20px 0;
}

.switch {
  position: relative;
  width: 60px;
  height: 34px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 34px;
  cursor: pointer;
  transition: 0.4s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  left: 4px;
  bottom: 4px;
  background: #fff;
  border-radius: 50%;
  transition: 0.4s;
}

input:checked + .slider {
  background: gold;
}

input:checked + .slider:before {
  transform: translateX(26px);
}

/* ================= SERVICES GRID ================= */
.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.service {
  width: 160px;
  background: #111;
  border: 1px solid #444;
  border-radius: 10px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: 0.3s;
}

.service:hover {
  transform: scale(1.05);
  border-color: gold;
}

.service i {
  font-size: 32px;
  color: gold;
  margin-bottom: 10px;
}

/* ================= POPUP ================= */
.popup {
  display: none;
  position: absolute;
  inset: 10px;
  background: #222;
  border: 1px solid gold;
  border-radius: 8px;
  padding: 15px;
  z-index: 10;
}

.popup .close {
  position: absolute;
  top: 5px;
  right: 8px;
  cursor: pointer;
  color: gold;
  font-weight: bold;
}

/* ================= DRAWER ================= */
.drawer-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10000;
  background: rgba(0,0,0,0.7);
  border: none;
  color: gold;
  font-size: 1.5rem;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}

.drawer-toggle:hover {
  background: rgba(0,0,0,0.9);
}

.drawer {
  position: fixed;
  top: 0;
  right: -80px;
  height: 100%;
  width: 80px;
  background: rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;
  gap: 30px;
  z-index: 9999;
  transition: right 0.3s;
}

.drawer.open { right: 0; }

.drawer-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: gold;
  font-weight: bold;
  transition: transform 0.3s, color 0.3s;
}

.drawer-item i {
  font-size: 2rem;
  margin-bottom: 5px;
}

.drawer-item:hover {
  color: #FFD700;
  transform: translateX(-5px);
}

/* ================= FOOTER ================= */
footer {
  text-align: center;
  padding: 15px;
  font-size: 0.8rem;
  color: #ccc;
}
</style>
</head>

<body>

<header>
  <div class="header-slider">
    <div class="slide" style="background-image:url('task1.jpg')"></div>
    <div class="slide" style="background-image:url('tactical2.jpg')"></div>
    <div class="slide" style="background-image:url('task2.jpg')"></div>
    <div class="slide" style="background-image:url('task3.jpg')"></div>

    <div class="slide" style="background-image:url('task9.jpg')"></div>

<!-- BONVI CHATBOT -->
<style>
#bonvi-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#FFD700;
  color:black;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 15px #FFD700;
}

/* CHAT BOX */
#bonvi-chat{
  position:fixed;
  bottom:90px;
  right:20px;
  width:320px;
  background:#0A0A0F;
  border-radius:15px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 20px #FFD700;
}

/* HEADER */
.chat-header{
  background:#FFD700;
  color:black;
  padding:10px;
  font-weight:bold;
}

/* MESSAGES */
.chat-body{
  padding:10px;
  height:300px;
  overflow-y:auto;
}

/* BUBBLES */
.bot{
  background:white;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

.user{
  background:#FFD700;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
  text-align:right;
}

/* SUGGESTIONS */
.suggestions{
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.suggestions button{
  background:#FFD700;
  border:none;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;
}
</style>

<button id="bonvi-btn">💬</button>

<div id="bonvi-chat">
  <div class="chat-header">✨ Bonvi Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="suggestions" id="suggestions">
    <button onclick="send('location')">Location</button>
    <button onclick="send('services')">Services</button>
    <button onclick="send('contact')">Contact</button>
    <button onclick="send('faq')">FAQ</button>
  </div>
</div>

<script>
const chat = document.getElementById("bonvi-chat");
const body = document.getElementById("chatBody");
const suggestions = document.getElementById("suggestions");

document.getElementById("bonvi-btn").onclick = ()=>{
  chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  chat.style.flexDirection = "column";
};

// GREETING
function greet(){
  addBot(`Hi 👋 I'm Bonvi, your friendly assistant!<br><br>
  I can help you with our location, services, or connecting you with our admin team.<br><br>
  What would you like to know today?`);
}
greet();

// SEND FUNCTION
function send(type){
  addUser(type);

if(type === "location"){
  addBot(`Sure! Here's our location 📍:<br>
  9 Corridor Crest, Ben Fleur, eMalahleni 1049<br><br>
  <img src="map.jpg" alt="Map Location" style="width:100%;border-radius:10px;">`);
  showSuggestions(["services","contact","faq"]);
}

 
else if(type === "services"){
  addBot(`Absolutely! Here are our services 🛡:<br><br>
  
<b>Armed Response</b><br>
Authorized armed response with trained personnel to protect your property and personnel quickly and efficiently.<br><br>

<b>Railway Protection</b><br>
Protection of railway assets and infrastructure to ensure safety, security, and operational continuity.<br><br>

<b>Mobile Patrol</b><br>
Regular vehicle patrols for rapid area monitoring and deterrence of unauthorized activity.<br><br>

<b>Event Security</b><br>
Professional crowd and event control to ensure safety and smooth operations during public and private events.<br><br>

<b>VIP Escort</b><br>
Close protection services for high-profile individuals to guarantee personal safety.<br><br>

<b>Dog Handling (K9)</b><br>
Highly trained K9 units for security patrols, detection, and threat deterrence.<br><br>

<b>Drone Surveillance</b><br>
Aerial security surveillance services for enhanced monitoring of large areas or difficult-to-reach locations.<br><br>

<b>CCTV Installation</b><br>
Professional setup and monitoring of CCTV systems to ensure constant surveillance and safety.`);
  
  showSuggestions(["pricing","book","contact","faq"]);
}
  else if(type === "contact"){
    addBot(`Of course! You can contact us 📞:<br><br>
    📧 vacancies@boninco.com<br>
    📧 admin@bonvinco.com<br><br>
    Ermelo – 087 149 4670<br>
    Witbank – 083 621 7499<br><br>
    🏢 OFFICE 1, 14 Kerk Street, Ermelo, 2351`);
    showSuggestions(["location","services","faq"]);
  }

  else if(type === "faq"){
    addBot(`Here are some frequently asked questions 🤔:<br><br>
    1️⃣ What are your operating hours?<br>
    2️⃣ How do I book a service?<br>
    3️⃣ Do you provide emergency support?<br><br>
    Click a question to see the answer.`);
    showSuggestions(["hours","book","emergency","contact"]);
  }

  else if(type === "hours"){
    addBot(`🕘 We operate 24/7 to ensure your safety!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "book"){
    addBot(`To book a service, just contact our admin via 📧 admin@bonvinco.com or 📞 087 149 4670. They'll assist you immediately!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "emergency"){
    addBot(`Yes! We provide emergency response 24/7. 🚨<br>
    Call our emergency line immediately if needed.`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "pricing"){
    addBot(`Pricing depends on the service. For exact quotes, please contact us via 📧 admin@bonvinco.com.`);
    showSuggestions(["services","contact","faq"]);
  }
}

// SHOW DYNAMIC SUGGESTIONS
function showSuggestions(options){
  suggestions.innerHTML = "";
  const map = {
    location:"Location",
    services:"Services",
    contact:"Contact",
    faq:"FAQ",
    hours:"Operating Hours",
    book:"Book a Service",
    emergency:"Emergency Support",
    pricing:"Pricing"
  };

  options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.innerHTML = map[opt];
    btn.onclick = ()=>send(opt);
    suggestions.appendChild(btn);
  });
}

// MESSAGE FUNCTIONS
function addBot(text){
  body.innerHTML += `<div class="bot">${text}</div>`;
  body.scrollTop = body.scrollHeight;
}

function addUser(text){
  body.innerHTML += `<div class="user">${text}</div>`;
}
</script>
<div class="section-title">
  <h1 id="servicesTitle"></h1>
</div>

<button id="drawerToggle" class="drawer-toggle">
  <i class="fas fa-bars"></i>
</button>

<div class="drawer" id="drawer">
  <a href="index.html" class="drawer-item">
    <i class="fas fa-home"></i>
    <span>Home</span>
  </a>
  <a href="service.html" class="drawer-item">
    <i class="fas fa-concierge-bell"></i>
    <span>Services</span>
  </a>
  <a href="about.html" class="drawer-item">
    <i class="fas fa-info-circle"></i>
    <span>About Us</span>
  </a>
  <a href="jobs.html" class="drawer-item">
    <i class="fas fa-briefcase"></i>
    <span>Jobs</span>
  </a>
  <a href="ads.html" class="drawer-item">
    <i class="fas fa-bullhorn"></i>
    <span>Ads</span>
  </a>
  <a href="contact.html" class="drawer-item">
    <i class="fas fa-envelope"></i>
    <span>Contact</span>
  </a>
</div>

<div class="switch-container">
  <p>Toggle between Tactical & Servillance</p>
  <label class="switch">
    <input type="checkbox" id="serviceSwitch">
    <span class="slider"></span>
  </label>
</div>

<div class="grid" id="serviceGrid"></div>

<footer>⚡️Powered by BlackLogic Technologies Pty Ltd 💻</footer>

<script>
const drawer = document.getElementById('drawer');
const toggleBtn = document.getElementById('drawerToggle');

toggleBtn.addEventListener('click', () => {
  drawer.classList.toggle('open');
});

// Typewriter header
const titleText = "Our Services";
let tIndex = 0;
const titleEl = document.getElementById("servicesTitle");

function typeTitle() {
  titleEl.textContent = titleText.substring(0, tIndex++);
  if (tIndex <= titleText.length) setTimeout(typeTitle, 120);
}
typeTitle();

// Services data
const tactical = [
  {icon:"fa-shield-alt", title:"Armed Response", desc:"Authorized armed response with rapid deployment."},
  {icon:"fa-train", title:"Railway Protection", desc:"Protection of railway assets and passengers."},
  {icon:"fa-car", title:"Mobile Patrol", desc:"Vehicle patrols for fast area response."},
  {icon:"fa-user-shield", title:"Event Security", desc:"Professional crowd and event control."}
];

const servillance = [
  {icon:"fa-user-tie", title:"VIP Escort", desc:"Close protection for high-profile individuals."},
  {icon:"fa-dog", title:"Dog Handling", desc:"Highly trained K9 security units."},
  {icon:"fa-train", title:"Railway Protection", desc:"Railway surveillance and monitoring."},
  {icon:"fa-drone", title:"Drone Servillance", desc:"Aerial security surveillance systems."},
  {icon:"fa-video", title:"CCTV Installation", desc:"Professional CCTV setup and monitoring."}
];

const grid = document.getElementById("serviceGrid");

function renderServices(list) {
  grid.innerHTML = "";
  list.forEach(s => {
    const card = document.createElement("div");
    card.className = "service";
    card.innerHTML = `
      <i class="fas ${s.icon}"></i>
      <h4>${s.title}</h4>
      <p>${s.desc.substring(0,30)}...</p>
      <div class="popup">
        <span class="close">&times;</span>
        <p>${s.desc}</p>
      </div>
    `;
    card.onclick = () => {
      const pop = card.querySelector(".popup");
      pop.style.display = pop.style.display === "block" ? "none" : "block";
    };
    grid.appendChild(card);
  });
}

renderServices(tactical);

document.getElementById("serviceSwitch").addEventListener("change", e => {
  renderServices(e.target.checked ? servillance : tactical);
});
</script>
</body>
