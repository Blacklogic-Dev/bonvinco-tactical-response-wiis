<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonvinco Tactical Response | Services</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
  --gold: #FFD700;
  --dark-bg: #000;
  --card-bg: #111;
  --glass: rgba(255, 255, 255, 0.1);
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--dark-bg);
  color: #fff;
  overflow-x: hidden;
}

/* ================= HEADER SLIDER ================= */
header {
  height: 400px;
  position: relative;
  overflow: hidden;
}

.header-slider {
  display: flex;
  width: 1000%;
  height: 100%;
  animation: slideImages 40s infinite ease-in-out;
}

.slide {
  flex: 0 0 10%;
  height: 100%;
  background-size: cover;
  background-position: center;
}

.header-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8));
  z-index: 2;
}

@keyframes slideImages {
  0%, 10% { transform: translateX(0%); }
  11%, 20% { transform: translateX(-10%); }
  21%, 30% { transform: translateX(-20%); }
  31%, 40% { transform: translateX(-30%); }
  41%, 50% { transform: translateX(-40%); }
  51%, 60% { transform: translateX(-50%); }
  61%, 70% { transform: translateX(-60%); }
  71%, 80% { transform: translateX(-70%); }
  81%, 90% { transform: translateX(-80%); }
  91%, 100% { transform: translateX(-90%); }
}

/* ================= SECTION TITLE ================= */
.section-title {
  text-align: center;
  margin: 40px 0 20px;
}

.section-title h1 {
  font-size: 3rem;
  color: var(--gold);
  border-right: 0.15em solid var(--gold);
  width: fit-content;
  margin: auto;
  text-transform: uppercase;
  letter-spacing: 3px;
}

/* ================= TOGGLE SWITCH ================= */
.switch-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 20px 0 40px;
}

.switch-container p {
  margin-bottom: 15px;
  font-weight: bold;
  letter-spacing: 1px;
  color: #ccc;
}

.switch {
  position: relative;
  width: 60px;
  height: 34px;
}

.switch input { display: none; }

.slider {
  position: absolute;
  inset: 0;
  background: #333;
  border-radius: 34px;
  cursor: pointer;
  transition: 0.4s;
}

.slider:before {
  content: "";
  position: absolute;
  width: 26px; height: 26px;
  left: 4px; bottom: 4px;
  background: #fff;
  border-radius: 50%;
  transition: 0.4s;
}

input:checked + .slider { background: var(--gold); }
input:checked + .slider:before { transform: translateX(26px); }

/* ================= SERVICES GRID (FLIP CARDS) ================= */
.grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 30px;
  padding: 20px 50px;
}

.service {
  width: 220px;
  height: 250px;
  perspective: 1000px;
  cursor: pointer;
  animation: fadeInUp 0.6s ease forwards;
}

.service-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
}

.service:hover .service-inner { transform: rotateY(180deg); }

.service-front, .service-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  box-sizing: border-box;
  border: 1px solid rgba(255,215,0,0.2);
}

.service-front {
  background: var(--card-bg);
}

.service-front i {
  font-size: 3rem;
  color: var(--gold);
  margin-bottom: 15px;
}

.service-back {
  background: var(--gold);
  color: #000;
  transform: rotateY(180deg);
}

.service-back p {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.4;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================= DRAWER (GLASSMORPHISM) ================= */
.drawer-toggle {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 1000;
  background: var(--gold);
  border: none; color: #000;
  width: 50px; height: 50px;
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.drawer {
  position: fixed;
  top: 0; right: -280px;
  height: 100%; width: 280px;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(15px);
  display: flex;
  flex-direction: column;
  padding-top: 80px;
  z-index: 999;
  transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-left: 1px solid rgba(255,215,0,0.3);
}

.drawer.open { right: 0; }

.drawer-item {
  display: flex;
  align-items: center;
  padding: 20px 30px;
  text-decoration: none;
  color: var(--gold);
  font-weight: bold;
  gap: 20px;
  transition: background 0.3s;
}

.drawer-item:hover {
  background: rgba(255, 215, 0, 0.1);
  padding-left: 40px;
}

/* ================= CHATBOT ================= */
#bonvi-btn {
  position: fixed;
  bottom: 25px; right: 25px;
  background: var(--gold);
  border: none; border-radius: 50%;
  width: 65px; height: 65px;
  font-size: 24px; cursor: pointer;
  z-index: 1000;
  animation: pulse-gold 2s infinite;
}

@keyframes pulse-gold {
  0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
  70% { box-shadow: 0 0 0 15px rgba(255, 215, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
}

#bonvi-chat {
  position: fixed;
  bottom: 100px; right: 25px;
  width: 350px; height: 500px;
  background: #0A0A0F;
  border-radius: 20px;
  display: none;
  flex-direction: column;
  border: 1px solid var(--gold);
  z-index: 1001;
}

.chat-header { background: var(--gold); color: #000; padding: 15px; font-weight: bold; border-radius: 18px 18px 0 0; }
.chat-body { padding: 15px; flex-grow: 1; overflow-y: auto; }
.bot { background: #222; color: #fff; padding: 12px; border-radius: 15px 15px 15px 0; margin-bottom: 10px; }
.user { background: var(--gold); color: #000; padding: 10px; border-radius: 15px 15px 0 15px; margin-left: auto; width: fit-content; margin-bottom: 10px; }

/* ================= FOOTER ================= */
footer {
  text-align: center;
  padding: 40px 20px;
  font-size: 0.85rem;
  color: #666;
  border-top: 1px solid #222;
  margin-top: 50px;
}
</style>
</head>

<body>

<!-- BONVI CHATBOT -->
<style>
#bonvi-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#FFD700;
  color:black;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 0 15px #FFD700;
}

/* CHAT BOX */
#bonvi-chat{
  position:fixed;
  bottom:90px;
  right:20px;
  width:320px;
  background:#0A0A0F;
  border-radius:15px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 20px #FFD700;

/* HEADER */
.chat-header{
  background:#FFD700;

  padding:10px;
  font-weight:bold;

  padding:10px;
  height:300px;
  overflow-y:auto;
}

/* BUBBLES */
.bot{
  background:white;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
}

.user{
  background:#FFD700;
  color:black;
  padding:8px;
  border-radius:10px;
  margin:5px 0;
  text-align:right;
}

/* SUGGESTIONS */
.suggestions{
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.suggestions button{
  background:#FFD700;
  border:none;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;

<button id="bonvi-btn">💬</button>

<div id="bonvi-chat">
  <div class="chat-header">✨ Bonvi Assistant</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="suggestions" id="suggestions">
    <button onclick="send('location')">Location</button>
    <button onclick="send('services')">Services</button>
    <button onclick="send('contact')">Contact</button>
    <button onclick="send('faq')">FAQ</button>
  </div>
</div>

<script>
const chat = document.getElementById("bonvi-chat");
const body = document.getElementById("chatBody");
const suggestions = document.getElementById("suggestions");

document.getElementById("bonvi-btn").onclick = ()=>{
  chat.style.display = chat.style.display === "flex" ? "none" : "flex";
  chat.style.flexDirection = "column";
};

// GREETING
function greet(){
  addBot(`Hi 👋 I'm Bonvi, your friendly assistant!<br><br>
  I can help you with our location, services, or connecting you with our admin team.<br><br>
  What would you like to know today?`);
}
greet();

// SEND FUNCTION
function send(type){
  addUser(type);

if(type === "location"){
  addBot(`Sure! Here's our location 📍:<br>
  9 Corridor Crest, Ben Fleur, eMalahleni 1049<br><br>
  <img src="map.jpg" alt="Map Location" style="width:100%;border-radius:10px;">`);
  showSuggestions(["services","contact","faq"]);
}

 
else if(type === "services"){
  addBot(`Absolutely! Here are our services 🛡:<br><br>
  
<b>Armed Response</b><br>
Authorized armed response with trained personnel to protect your property and personnel quickly and efficiently.<br><br>

<b>Railway Protection</b><br>
Protection of railway assets and infrastructure to ensure safety, security, and operational continuity.<br><br>

<b>Mobile Patrol</b><br>
Regular vehicle patrols for rapid area monitoring and deterrence of unauthorized activity.<br><br>

<b>Event Security</b><br>
Professional crowd and event control to ensure safety and smooth operations during public and private events.<br><br>

<b>VIP Escort</b><br>
Close protection services for high-profile individuals to guarantee personal safety.<br><br>

<b>Dog Handling (K9)</b><br>
Highly trained K9 units for security patrols, detection, and threat deterrence.<br><br>

<b>Drone Surveillance</b><br>
Aerial security surveillance services for enhanced monitoring of large areas or difficult-to-reach locations.<br><br>

<b>CCTV Installation</b><br>
Professional setup and monitoring of CCTV systems to ensure constant surveillance and safety.`);
  
  showSuggestions(["pricing","book","contact","faq"]);
}
  else if(type === "contact"){
    addBot(`Of course! You can contact us 📞:<br><br>
    📧 vacancies@boninco.com<br>
    📧 admin@bonvinco.com<br><br>
    Ermelo – 087 149 4670<br>
    Witbank – 083 621 7499<br><br>
    🏢 OFFICE 1, 14 Kerk Street, Ermelo, 2351`);
    showSuggestions(["location","services","faq"]);
  }

  else if(type === "faq"){
    addBot(`Here are some frequently asked questions 🤔:<br><br>
    1️⃣ What are your operating hours?<br>
    2️⃣ How do I book a service?<br>
    3️⃣ Do you provide emergency support?<br><br>
    Click a question to see the answer.`);
    showSuggestions(["hours","book","emergency","contact"]);
  }

  else if(type === "hours"){
    addBot(`🕘 We operate 24/7 to ensure your safety!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "book"){
    addBot(`To book a service, just contact our admin via 📧 admin@bonvinco.com or 📞 087 149 4670. They'll assist you immediately!`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "emergency"){
    addBot(`Yes! We provide emergency response 24/7. 🚨<br>
    Call our emergency line immediately if needed.`);
    showSuggestions(["services","contact","faq"]);
  }

  else if(type === "pricing"){
    addBot(`Pricing depends on the service. For exact quotes, please contact us via 📧 admin@bonvinco.com.`);
    showSuggestions(["services","contact","faq"]);
  }
}

// SHOW DYNAMIC SUGGESTIONS
function showSuggestions(options){
  suggestions.innerHTML = "";
  const map = {
    location:"Location",
    services:"Services",
    contact:"Contact",
    faq:"FAQ",
    hours:"Operating Hours",
    book:"Book a Service",
    emergency:"Emergency Support",
    pricing:"Pricing"
  };

  options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.innerHTML = map[opt];
    btn.onclick = ()=>send(opt);
    suggestions.appendChild(btn);
  });
}

// MESSAGE FUNCTIONS
function addBot(text){
  body.innerHTML += `<div class="bot">${text}</div>`;
  body.scrollTop = body.scrollHeight;
}

function addUser(text){
  body.innerHTML += `<div class="user">${text}</div>`;
}
</script>
<footer>⚡️ Powered by BlackLogic Technologies Pty Ltd 💻</footer>

<script>
// UI Elements
const drawer = document.getElementById('drawer');
const toggleBtn = document.getElementById('drawerToggle');
const grid = document.getElementById("serviceGrid");
const serviceSwitch = document.getElementById("serviceSwitch");

// Navigation
toggleBtn.onclick = () => drawer.classList.toggle('open');

// Typewriter
const titleText = "Our Mission Profile";
let tIndex = 0;
function typeTitle() {
  document.getElementById("servicesTitle").textContent = titleText.substring(0, tIndex++);
  if (tIndex <= titleText.length) setTimeout(typeTitle, 100);
}
typeTitle();

// Data
const tactical = [
  {icon:"fa-shield-alt", title:"Armed Response", desc:"Rapid-deployment tactical units authorized for high-threat intervention and property protection."},
  {icon:"fa-train", title:"Railway Protection", desc:"Securing critical infrastructure, preventing cable theft, and ensuring commuter safety on rail lines."},
  {icon:"fa-car", title:"Mobile Patrol", desc:"24/7 proactive vehicle visibility to deter crime and monitor residential or industrial zones."},
  {icon:"fa-user-shield", title:"Event Security", desc:"Specialized crowd control and logistical security for large-scale public or private gatherings."}
];

const surveillance = [
  {icon:"fa-user-tie", title:"VIP Escort", desc:"Discreet and effective close protection for high-profile personnel and high-value assets."},
  {icon:"fa-dog", title:"K9 Handling", desc:"Trained canine units for explosives detection, tracking, and perimeter deterrence."},
  {icon:"fa-drone", title:"Drone Ops", desc:"Aerial intelligence and thermal imaging for large-area monitoring and perimeter breaches."},
  {icon:"fa-video", title:"CCTV Monitoring", desc:"Advanced control-room monitoring and professional installation of high-definition security grids."}
];

function renderServices(list) {
  grid.innerHTML = "";
  list.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "service";
    card.style.animationDelay = `${i * 0.1}s`;
    card.innerHTML = `
      <div class="service-inner">
        <div class="service-front">
          <i class="fas ${s.icon}"></i>
          <h4>${s.title}</h4>
        </div>
        <div class="service-back">
          <p>${s.desc}</p>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

renderServices(tactical);
serviceSwitch.onchange = (e) => renderServices(e.target.checked ? surveillance : tactical);

// Chatbot Logic
const chatBtn = document.getElementById("bonvi-btn");
const chatBox = document.getElementById("bonvi-chat");
const chatBody = document.getElementById("chatBody");

chatBtn.onclick = () => chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";

function addBotMsg(text) {
  chatBody.innerHTML += `<div class="bot">${text}</div>`;
  chatBody.scrollTop = chatBody.scrollHeight;
}

addBotMsg("Welcome to Bonvinco Tactical. How can I assist with your security profile today?");
</script>
